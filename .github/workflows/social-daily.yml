# Daily puzzle video: tops up the review queue (render + R2) and posts today's
# video to Instagram (Reel) and TikTok (inbox draft). See scripts/social/README.md.
#
# Nothing posts until the repository variable SOCIAL_MODE is "live"; until then
# the publish step only logs what it would do. Review / veto the queue on
# /analytics (admin).
name: social-daily

on:
  schedule:
    - cron: '0 17 * * *' # ~noon US Eastern; GitHub may start it a little late
  workflow_dispatch:
    inputs:
      step:
        description: Which step to run
        type: choice
        options: [all, plan, publish]
        default: all
      days:
        description: Days to keep queued ahead
        default: '7'

# Never two runs at once: TikTok refresh tokens rotate, and the planner fills slots.
concurrency:
  group: social-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOCIAL_OWNER_USER_ID: ${{ secrets.SOCIAL_OWNER_USER_ID }}
      SOCIAL_KV_NAMESPACE_ID: ${{ vars.SOCIAL_KV_NAMESPACE_ID }}
      SOCIAL_MODE: ${{ vars.SOCIAL_MODE || 'dry' }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      STOCKFISH_PATH: /usr/games/stockfish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg + Stockfish
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg stockfish

      - run: npm ci

      - name: Plan (fill the queue)
        if: github.event_name == 'schedule' || inputs.step == 'all' || inputs.step == 'plan'
        run: node scripts/social/plan.ts --remote --days "${{ inputs.days || '7' }}"

      - name: Publish today's video
        if: github.event_name == 'schedule' || inputs.step == 'all' || inputs.step == 'publish'
        run: node scripts/social/publish.ts --remote

      # Alerting (workers/notifier/src/alerts.ts): a failed run emails the admin
      # through the notifier; the next good run sends "recovered". Needs the
      # NOTIFIER_ADMIN_SECRET repository secret (= the Worker's ADMIN_SECRET);
      # without it this step does nothing.
      - name: Report the result to the notifier
        if: always() && github.event_name == 'schedule'
        env:
          NOTIFIER_ADMIN_SECRET: ${{ secrets.NOTIFIER_ADMIN_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NOTIFIER_ADMIN_SECRET" ] || exit 0
          ok=true; [ "$JOB_STATUS" = "success" ] || ok=false
          curl -sS -m 20 -X POST https://email.patternchess.com/admin/alert \
            -H "Authorization: Bearer $NOTIFIER_ADMIN_SECRET" -H 'Content-Type: application/json' \
            -d "{\"check\":\"social-daily\",\"ok\":$ok,\"detail\":\"social-daily $JOB_STATUS: $RUN_URL\"}" || true
